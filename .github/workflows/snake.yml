name: Generate Snake Animation

on:
  schedule:
    # Runs twice a day (every 12 hours), at 00:00 and 12:00 UTC.
    - cron: "0 */12 * * *"
  # Allows manual runs from the Actions tab.
  workflow_dispatch:
  # Regenerates whenever the profile is updated.
  push:
    branches:
      - main

# Required so the default GITHUB_TOKEN can push the generated
# SVGs to the "output" branch (tokens are read-only by default).
permissions:
  contents: write

jobs:
  generate:
    name: Generate snake from contribution graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate snake animation (light, dark and gif)
        # Pinned to a commit SHA for supply-chain safety (Dependabot keeps it fresh).
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#00bfbf&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      - name: Push generated files to the "output" branch
        # Pinned to a commit SHA for supply-chain safety (Dependabot keeps it fresh).
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
